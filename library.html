<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашняя библиотека</title>
    <script src="js/Library2.js"></script>
    <style>
        .panel {
            border: solid 1px black;
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
            box-sizing: border-box;
        }
    </style>
    <script src="js/libraryHTML.js"></script>
</head>
<body onload="loadPage()">
    <h1>Домашняя библиотека</h1>
    <div id="viewTable"></div>

    <input type="button" value="Добавить новую книгу" onclick="openNewBook()">

    <dialog id="editBookInfo" closedby="any">
        <input type="hidden" value="" id="updateBook">
        <div class="panel">
            <table>
                <tr>
                    <td>Название книги</td>
                    <td><input id="nameBook"></td>
                </tr>
                <tr>
                    <td>Автор произведения
                    <td><input id="author"></td>
                </tr>
                <tr>
                    <td>Описание</td>
                    <td><textarea id="bookDesc" rows="10" cols="50"></textarea></td>
                </tr>
                <tr>
                    <td>Номер шкафа</td>
                    <td><input id="numBookcase"></td>
                </tr>
                <tr>
                    <td>Номер полки</td>
                    <td><input type="number" min="1" max="20" id="numShelf"></td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="button" value="Сохранить" onclick="ApplySaveBook()">
                        <input type="button" value="Отмена" onclick="CloseDialog()">
                    </td>
                </tr>
            </table>
        </div>
    </dialog>
</body>
</html>
